[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-cyber-range"
version = "0.1.0"
description = "Synthetic red/blue cyber-range for network-configuration generalization research."
requires-python = ">=3.13,<3.14"
dependencies = [
    "networkx==3.6.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
