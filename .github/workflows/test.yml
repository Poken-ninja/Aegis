name: Tests

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run full test suite
        run: python -m pytest
